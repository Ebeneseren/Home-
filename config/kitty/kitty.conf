# --- Match Alacritty look/feel ---

# Pywal colors (like your Alacritty import)
include ~/.cache/wal/colors-kitty.conf

# Window
hide_window_decorations yes
remember_window_size yes
background #0d1117

# Padding (Kitty doesn't have "dynamic_padding" exactly; this is the close equivalent)
window_padding_width 8

# Font
font_family JetBrainsMono Nerd Font
font_size 10.0

# Cursor (optional, feels similar)
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Sensible defaults
enable_audio_bell no
confirm_os_window_close 0
